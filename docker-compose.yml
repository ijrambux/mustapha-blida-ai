# Mustapha Blida AI - Docker Compose
# ===================================
version: "3.8"

services:
  api:
    build: .
    container_name: mustapha-blida-ai-api
    ports:
      - "8080:8080"
    volumes:
      - ./config.toml:/app/config.toml
      - ./storage:/app/storage
      - ./resource:/app/resource
    environment:
      - PYTHONUNBUFFERED=1
    command: python main.py
    restart: unless-stopped
    networks:
      - mustapha-network

  webui:
    build: .
    container_name: mustapha-blida-ai-webui
    ports:
      - "8501:8501"
    volumes:
      - ./config.toml:/app/config.toml
      - ./storage:/app/storage
      - ./resource:/app/resource
    environment:
      - PYTHONUNBUFFERED=1
    command: streamlit run webui/Main.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - mustapha-network

networks:
  mustapha-network:
    driver: bridge
